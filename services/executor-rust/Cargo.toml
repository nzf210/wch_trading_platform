[package]
name = "executor-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "=1.40.0", features = ["full"] }
serde = { version = "=1.0.193", features = ["derive"] }
serde_json = "=1.0.108"
sqlx = { version = "=0.7.3", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
redis = { version = "=0.23.5", features = ["tokio-comp", "json"] }
chrono = { version = "=0.4.31", features = ["serde"] }
uuid = { version = "=1.4.1", features = ["serde", "v4"] }
anyhow = "=1.0.75"
tracing = "=0.1.37"
tracing-subscriber = { version = "=0.3.17", features = ["env-filter", "fmt", "json"] }
dotenvy = "=0.15.7"
async-trait = "=0.1.77"
futures = "=0.3.29"
reqwest = { version = "=0.11.22", default-features = false, features = ["json", "rustls-tls"] }
hmac = "=0.12.1"
sha2 = "=0.10.7"
hex = "=0.4.3"
base64 = "=0.21.5"
aes = "=0.7.5"
cipher = "=0.4.3"
cfb-mode = "=0.7.1"
prometheus = "=0.13.3"
lazy_static = "=1.4.0"
warp = "=0.3.5"
